<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆系统 · 演示回放</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="live.css">
</head>
<body>
<div id="stage">

  <section class="screen" id="s1">
    <div class="s1-wrap">
      <div class="kicker">记忆系统 · 课堂现场</div>
      <h1 class="s1-title">同一个 Agent，同一个模型，<br>只换记忆</h1>
      <div class="s1-sub">看清每个系统：怎么存　·　怎么找　·　花多少</div>
      <div class="s1-sub2">Agent = Pi　·　模型 qwen3.8-flash　·　新会话开始时取回记忆，放进系统提示</div>
      <div class="s1-cols" id="s1-cols"></div>
    </div>
  </section>

  <section class="screen" id="s2">
    <header class="head">
      <h1>怎么存 · 同样五句话，三种存法</h1>
      <div class="stamp" id="s2-stamp"></div>
    </header>
    <div class="mem-cards" id="s2-cards"></div>
    <nav class="tabs" id="s2-tabs"></nav>
    <div class="panel" id="s2-panel"><div class="loading">读取中…</div></div>
  </section>

  <section class="screen" id="s3">
    <div class="ask-head">
      <div class="act-chip">怎么找</div>
      <div class="now-chip" id="s3-now">现在：2026-11-08 10:00</div>
      <input id="s3-input" class="ask-input" spellcheck="false" autocomplete="off"
             value="昨天的派对马斯克来了吗？">
      <button id="s3-btn" class="ask-btn">问</button>
    </div>
    <div class="cols" id="s3-cols"></div>
  </section>

  <section class="screen" id="s4">
    <header class="head">
      <h1>怎么写 · 六段对话依次交给每个系统</h1>
      <div class="actions">
        <button id="s4-reset" class="btn ghost">清空，重新开始</button>
        <button id="s4-next" class="btn">写入下一段</button>
        <button id="s4-all" class="btn primary">全部写入</button>
      </div>
      <div class="stamp" id="s4-stamp"></div>
    </header>
    <div class="write-body">
      <aside class="sessions" id="s4-sessions"></aside>
      <div class="wright askbody" id="s4-cols"></div>
    </div>
  </section>

  <section class="screen" id="swc">
    <header class="head">
      <h1>写入花多少 · 六段对话</h1>
      <div class="stamp" id="swc-stamp"></div>
    </header>
    <div class="wc" id="swc-body"><div class="loading">读取中…</div></div>
    <div class="s8-note" id="swc-note"></div>
  </section>

  <section class="screen" id="s5">
    <div class="ask-head">
      <div class="act-chip">新会话</div>
      <div class="now-chip" id="s5-now">现在：2026-11-02 23:30</div>
      <input id="s5-input" class="ask-input" spellcheck="false" autocomplete="off"
             value="我睡着以后，烟测超预算了怎么办？">
      <button id="s5-btn" class="ask-btn">问</button>
    </div>
    <div class="cols" id="s5-cols"></div>
  </section>

  <section class="screen" id="src">
    <header class="head">
      <h1>读取花多少 · 刚才那个问题</h1>
      <div class="stamp" id="src-q"></div>
    </header>
    <div class="rcx" id="src-body"></div>
    <div class="s8-note">一次运行的结果：作答用时受接口速度影响很大，主要看调用次数和 tokens。</div>
  </section>

  <div id="pager"><span id="pager-num">1</span><span class="pager-sep">/</span><span class="pager-all">7</span></div>
</div>
<script>window.MEMORY_REPLAY = { base: "data/" };</script>
<script src="live.js"></script>
</body>
</html>
